name: Validate
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - run: pnpm install --frozen-lockfile
      - name: Build applications without cloud credentials
        run: pnpm build
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check

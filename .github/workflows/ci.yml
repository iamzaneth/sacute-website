name: Validate
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - run: pnpm install --frozen-lockfile
      - name: Build web before other checks generate shared artifacts
        run: pnpm --filter @sacute/web build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: |
            test-results/
            playwright-report/
